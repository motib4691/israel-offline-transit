name: Build Offline Israel Map Pack

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: map-build
  cancel-in-progress: false

jobs:
  build-and-publish-map:
    name: Generate israel-map-pack.zip
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies for address indexing
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install osmium

      - name: Create working directories
        shell: bash
        run: mkdir -p build/store build/map-pack build/gh-builder/src/main/java

      - name: Download latest OpenStreetMap data for Israel
        shell: bash
        run: |
          set -euo pipefail
          echo "Downloading Israel & Palestine OSM PBF extract from Geofabrik..."
          curl -fL --retry 3 --retry-delay 5 \
            "https://download.geofabrik.de/asia/israel-and-palestine-latest.osm.pbf" \
            -o build/israel.osm.pbf

      - name: Download OSM ocean water polygons (with safe fallback)
        shell: bash
        run: |
          set -euo pipefail
          echo "Downloading OSM water polygons for sea/coastline rendering..."
          if curl -fL --retry 2 --retry-delay 5 \
            "https://osmdata.openstreetmap.de/download/water-polygons-split-4326.zip" \
            -o build/water-polygons.zip; then
            unzip -q build/water-polygons.zip -d build
            rm -f build/water-polygons.zip
            echo "HAS_OCEAN=true" >> "$GITHUB_ENV"
          else
            echo "Warning: Could not download ocean polygons, continuing with inland water only."
            echo "HAS_OCEAN=false" >> "$GITHUB_ENV"
          fi

      - name: Prepare Tilemaker configuration and Lua processing script
        shell: bash
        run: |
          set -euo pipefail

          if [ "${HAS_OCEAN}" = "true" ] && [ -f "build/water-polygons-split-4326/water_polygons.shp" ]; then
            OCEAN_LAYER='"ocean": { "minzoom": 6, "maxzoom": 14, "source": "/data/water-polygons-split-4326/water_polygons.shp", "simplify_below": 12, "simplify_level": 0.0005 },'
          else
            OCEAN_LAYER=''
          fi

          cat << EOF > build/map_config.json
          {
            "layers": {
              ${OCEAN_LAYER}
              "water": {
                "minzoom": 6,
                "maxzoom": 14,
                "simplify_below": 12,
                "simplify_level": 0.0003
              },
              "waterway": {
                "minzoom": 9,
                "maxzoom": 14,
                "simplify_below": 12,
                "simplify_level": 0.0003
              },
              "landuse": {
                "minzoom": 8,
                "maxzoom": 14,
                "simplify_below": 12,
                "simplify_level": 0.0004
              },
              "railway": {
                "minzoom": 8,
                "maxzoom": 14,
                "simplify_below": 12,
                "simplify_level": 0.0002
              },
              "roads": {
                "minzoom": 6,
                "maxzoom": 14,
                "simplify_below": 13,
                "simplify_level": 0.00025
              },
              "places": {
                "minzoom": 6,
                "maxzoom": 14
              }
            },
            "settings": {
              "name": "Israel Offline Basemap",
              "version": "2.0",
              "description": "Lightweight offline vector basemap for Israel",
              "minzoom": 6,
              "maxzoom": 14,
              "basezoom": 14,
              "include_ids": false,
              "compress": "gzip"
            }
          }
          EOF

          cat << 'EOF' > build/map_process.lua
          node_keys = { "place", "railway", "amenity", "shop", "aeroway", "tourism", "name", "name:he", "name:en" }

          function init_processing()
          end

          function exit_processing()
          end

          local function preferred_name()
              local name_he = Find("name:he")
              if name_he ~= "" then return name_he end
              local name = Find("name")
              if name ~= "" then return name end
              local name_en = Find("name:en")
              return name_en
          end

          local function emit_poi(kind, label, minzoom, as_centroid)
              if label == "" then return end
              if as_centroid then
                  LayerAsCentroid("places")
              else
                  Layer("places", false)
              end
              Attribute("kind", kind)
              Attribute("name", label)
              MinZoom(minzoom)
          end

          function node_function()
              local place = Find("place")
              local railway = Find("railway")
              local amenity = Find("amenity")
              local shop = Find("shop")
              local aeroway = Find("aeroway")
              local tourism = Find("tourism")
              local label = preferred_name()

              if label == "" then
                  return
              end

              if place == "city" then
                  emit_poi("city", label, 6, false)
              elseif place == "town" then
                  emit_poi("town", label, 8, false)
              elseif place == "village" then
                  emit_poi("village", label, 10, false)
              elseif place == "suburb" or place == "quarter" or place == "neighbourhood" then
                  emit_poi("neighbourhood", label, 12, false)
              elseif railway == "station" then
                  emit_poi("train_station", label, 11, false)
              elseif railway == "tram_stop" then
                  emit_poi("tram_stop", label, 13, false)
              elseif amenity == "bus_station" then
                  emit_poi("bus_station", label, 12, false)
              elseif amenity == "hospital" then
                  emit_poi("hospital", label, 12, false)
              elseif amenity == "university" or amenity == "college" then
                  emit_poi("university", label, 12, false)
              elseif shop == "mall" then
                  emit_poi("mall", label, 13, false)
              elseif aeroway == "aerodrome" then
                  emit_poi("airport", label, 10, false)
              elseif tourism == "museum" then
                  emit_poi("poi", label, 13, false)
              elseif amenity == "parking" and Find("park_ride") == "yes" then
                  emit_poi("parking", label, 13, false)
              end
          end

          function way_function()
              local natural = Find("natural")
              local waterway = Find("waterway")
              local landuse = Find("landuse")
              local leisure = Find("leisure")
              local boundary = Find("boundary")
              local railway = Find("railway")
              local highway = Find("highway")
              local amenity = Find("amenity")
              local shop = Find("shop")
              local aeroway = Find("aeroway")
              local tourism = Find("tourism")
              local label = preferred_name()

              if IsClosed() and label ~= "" then
                  if amenity == "hospital" then
                      emit_poi("hospital", label, 12, true)
                  elseif amenity == "university" or amenity == "college" then
                      emit_poi("university", label, 12, true)
                  elseif shop == "mall" then
                      emit_poi("mall", label, 13, true)
                  elseif aeroway == "aerodrome" then
                      emit_poi("airport", label, 10, true)
                  elseif tourism == "museum" then
                      emit_poi("poi", label, 13, true)
                  elseif amenity == "parking" and Find("park_ride") == "yes" then
                      emit_poi("parking", label, 13, true)
                  elseif amenity == "bus_station" then
                      emit_poi("bus_station", label, 12, true)
                  elseif railway == "station" then
                      emit_poi("train_station", label, 11, true)
                  end
              end

              -- Inland water bodies (Kinneret, Dead Sea, reservoirs, pools)
              if (natural == "water" or landuse == "reservoir" or waterway == "riverbank") and IsClosed() then
                  Layer("water", true)
                  Attribute("kind", "water")
                  if label ~= "" and Area() > 50000 then
                      Attribute("name", label)
                  end
                  MinZoom(6)
                  return
              end

              -- Rivers, streams and canals
              if waterway == "river" or waterway == "canal" then
                  Layer("waterway", false)
                  Attribute("kind", "river")
                  if label ~= "" then
                      Attribute("name", label)
                  end
                  MinZoom(9)
                  return
              elseif waterway == "stream" then
                  Layer("waterway", false)
                  Attribute("kind", "stream")
                  if label ~= "" then
                      Attribute("name", label)
                  end
                  MinZoom(12)
                  return
              end

              -- Major green areas, parks, forests and nature reserves (skip tiny patches)
              if (leisure == "park" or leisure == "nature_reserve" or landuse == "forest" or natural == "wood" or boundary == "national_park") and IsClosed() then
                  local area = Area()
                  if area > 5000 then
                      Layer("landuse", true)
                      if landuse == "forest" or natural == "wood" then
                          Attribute("kind", "forest")
                      else
                          Attribute("kind", "park")
                      end
                      if label ~= "" and area > 30000 then
                          Attribute("name", label)
                      end
                      if area > 200000 then
                          MinZoom(8)
                      elseif area > 30000 then
                          MinZoom(10)
                      else
                          MinZoom(12)
                      end
                  end
                  return
              end

              -- Railways & Light Rail
              if railway == "rail" or railway == "light_rail" or railway == "subway" or railway == "tram" then
                  Layer("railway", false)
                  Attribute("kind", railway)
                  if railway == "rail" then
                      MinZoom(8)
                  else
                      MinZoom(11)
                  end
                  return
              end

              -- Roads & Walking paths
              if highway ~= "" then
                  local kind = ""
                  if highway == "motorway" or highway == "trunk" or highway == "primary" then
                      kind = "highway"
                  elseif highway == "secondary" or highway == "tertiary" then
                      kind = "major_road"
                  elseif highway == "residential" or highway == "unclassified" or highway == "living_street" or highway == "road" then
                      kind = "minor_road"
                  elseif highway == "service" then
                      kind = "service_road"
                  elseif highway == "footway" or highway == "path" or highway == "pedestrian" or highway == "steps" or highway == "cycleway" or highway == "track" then
                      kind = "path"
                  end

                  if kind ~= "" then
                      Layer("roads", false)
                      Attribute("kind", kind)

                      if label ~= "" then
                          Attribute("name", label)
                      end

                      local ref = Find("ref")
                      if ref ~= "" then
                          Attribute("ref", ref)
                      end

                      if kind == "highway" then
                          MinZoom(6)
                      elseif kind == "major_road" then
                          MinZoom(9)
                      elseif kind == "minor_road" then
                          MinZoom(11)
                      else
                          MinZoom(13)
                      end
                  end
              end
          end
          EOF

      - name: Generate PMTiles vector map using Tilemaker
        shell: bash
        run: |
          set -euo pipefail
          echo "Generating PMTiles vector map using Docker..."

          docker run --rm \
            -v "$(pwd)/build:/data" \
            ghcr.io/systemed/tilemaker:master \
            /data/israel.osm.pbf \
            --output=/data/map-pack/israel-basemap.pmtiles \
            --config=/data/map_config.json \
            --process=/data/map_process.lua \
            --store=/data/store

      - name: Generate GraphHopper walking routing graph (8.0)
        shell: bash
        run: |
          set -euo pipefail
          echo "Generating lightweight GraphHopper 8.0 foot routing graph (without CH shortcuts)..."

          cat << 'EOF' > build/gh-builder/pom.xml
          <project xmlns="http://maven.apache.org/POM/4.0.0"
                   xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                   xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 http://maven.apache.org/xsd/maven-4.0.0.xsd">
            <modelVersion>4.0.0</modelVersion>
            <groupId>il.co.israeltransit</groupId>
            <artifactId>gh-graph-builder</artifactId>
            <version>1.0.0</version>
            <properties>
              <maven.compiler.source>17</maven.compiler.source>
              <maven.compiler.target>17</maven.compiler.target>
            </properties>
            <dependencies>
              <dependency>
                <groupId>com.graphhopper</groupId>
                <artifactId>graphhopper-core</artifactId>
                <version>8.0</version>
              </dependency>
              <dependency>
                <groupId>org.slf4j</groupId>
                <artifactId>slf4j-simple</artifactId>
                <version>1.7.36</version>
              </dependency>
            </dependencies>
            <build>
              <plugins>
                <plugin>
                  <groupId>org.codehaus.mojo</groupId>
                  <artifactId>exec-maven-plugin</artifactId>
                  <version>3.2.0</version>
                </plugin>
              </plugins>
            </build>
          </project>
          EOF

          cat << 'EOF' > build/gh-builder/src/main/java/BuildGraph.java
          import com.graphhopper.GraphHopper;
          import com.graphhopper.GraphHopperConfig;
          import com.graphhopper.config.Profile;
          import com.graphhopper.util.CustomModel;
          import java.util.Collections;

          public class BuildGraph {
              public static void main(String[] args) {
                  String osmFile = args[0];
                  String graphDir = args[1];

                  CustomModel footModel = new CustomModel();
                  footModel.setDistanceInfluence(70.0);

                  Profile footProfile = new Profile("foot");
                  footProfile.setVehicle("foot");
                  footProfile.setWeighting("custom");
                  footProfile.setCustomModel(footModel);

                  GraphHopperConfig ghConfig = new GraphHopperConfig()
                      .putObject("datareader.file", osmFile)
                      .putObject("graph.location", graphDir)
                      .putObject("import.osm.ignored_highways", "motorway,trunk")
                      .putObject("prepare.min_network_size", 400)
                      .setProfiles(Collections.singletonList(footProfile));

                  GraphHopper hopper = new GraphHopper().init(ghConfig);
                  hopper.importOrLoad();
                  hopper.close();
                  System.out.println("GraphHopper foot graph generated successfully at: " + graphDir);
              }
          }
          EOF

          export MAVEN_OPTS="-Xmx4g"
          mvn -B -f build/gh-builder/pom.xml compile exec:java \
            -Dexec.mainClass="BuildGraph" \
            -Dexec.args="$(pwd)/build/israel.osm.pbf $(pwd)/build/map-pack/graphhopper-foot"

      - name: Generate offline streets & addresses SQLite database
        shell: bash
        run: |
          set -euo pipefail
          echo "Extracting places, boundaries, POIs, streets and normalized addresses into SQLite..."

          cat << 'EOF' > build/build_addresses.py
          import math
          import sqlite3
          import sys
          from collections import Counter, defaultdict
          import osmium

          osm_path = sys.argv[1]
          db_path = sys.argv[2]

          PLACE_TYPES = {"city", "town", "village"}
          SUB_PLACE_TYPES = {"suburb", "quarter", "neighbourhood"}
          STREET_HIGHWAYS = {
              "primary", "secondary", "tertiary", "residential",
              "unclassified", "living_street", "pedestrian", "service", "road"
          }

          def pick_name(tags):
              return (
                  tags.get("name:he")
                  or tags.get("name")
                  or tags.get("name:en")
                  or ""
              ).strip()

          def classify_poi(tags):
              place = tags.get("place")
              if place in PLACE_TYPES or place in SUB_PLACE_TYPES:
                  return place
              amenity = tags.get("amenity")
              if amenity == "hospital":
                  return "hospital"
              if amenity in ("university", "college"):
                  return "university"
              if amenity == "bus_station":
                  return "bus_station"
              if amenity == "parking" and tags.get("park_ride") == "yes":
                  return "parking"
              if tags.get("shop") == "mall":
                  return "mall"
              if tags.get("aeroway") == "aerodrome":
                  return "airport"
              if tags.get("railway") == "station":
                  return "train_station"
              if tags.get("tourism") in ("museum", "attraction"):
                  return "poi"
              if tags.get("leisure") in ("park", "nature_reserve"):
                  return "park"
              return None

          def point_in_ring(lat, lon, ring):
              inside = False
              n = len(ring)
              if n < 3:
                  return False
              j = n - 1
              for i in range(n):
                  yi, xi = ring[i]
                  yj, xj = ring[j]
                  if ((yi > lat) != (yj > lat)) and (lon < (xj - xi) * (lat - yi) / (yj - yi) + xi):
                      inside = not inside
                  j = i
              return inside

          class PlaceCollector(osmium.SimpleHandler):
              def __init__(self):
                  super().__init__()
                  self.places = []
                  self.cities = []
                  self.city_grid = {}
                  self.seen_places = {}
                  self.boundaries = []

              def _add_place(self, name, kind, lat, lon):
                  key = (name, kind)
                  for prev_lat, prev_lon in self.seen_places.get(key, ()):
                      if abs(lat - prev_lat) < 0.02 and abs(lon - prev_lon) < 0.02:
                          return
                  self.seen_places.setdefault(key, []).append((lat, lon))
                  self.places.append((name, kind, lat, lon))
                  if kind in PLACE_TYPES:
                      idx = len(self.cities)
                      self.cities.append((name, kind, lat, lon))
                      gkey = (int(lat * 10), int(lon * 10))
                      self.city_grid.setdefault(gkey, []).append(idx)

              def node(self, n):
                  kind = classify_poi(n.tags)
                  if not kind:
                      return
                  name = pick_name(n.tags)
                  if not name:
                      return
                  self._add_place(name, kind, n.location.lat, n.location.lon)

              def area(self, a):
                  place = a.tags.get("place")
                  boundary = a.tags.get("boundary")
                  admin_level = a.tags.get("admin_level")
                  is_boundary = (place in PLACE_TYPES) or (
                      boundary == "administrative" and admin_level == "8"
                  )
                  kind = classify_poi(a.tags)
                  if not kind and not is_boundary:
                      return

                  name = pick_name(a.tags)
                  if not name:
                      return

                  first_lats = None
                  first_lons = None

                  for outer in a.outer_rings():
                      outer_pts = [(n.lat, n.lon) for n in outer if n.location.valid()]
                      if len(outer_pts) < 3:
                          continue
                      if first_lats is None:
                          first_lats = [p[0] for p in outer_pts]
                          first_lons = [p[1] for p in outer_pts]

                      if is_boundary:
                          inners = []
                          for inner in a.inner_rings(outer):
                              inner_pts = [(n.lat, n.lon) for n in inner if n.location.valid()]
                              if len(inner_pts) >= 3:
                                  inners.append(inner_pts)

                          min_lat = min(p[0] for p in outer_pts)
                          max_lat = max(p[0] for p in outer_pts)
                          min_lon = min(p[1] for p in outer_pts)
                          max_lon = max(p[1] for p in outer_pts)
                          bbox_area = max((max_lat - min_lat) * (max_lon - min_lon), 1e-12)
                          self.boundaries.append(
                              (bbox_area, name, min_lat, max_lat, min_lon, max_lon, outer_pts, inners)
                          )
                      elif kind:
                          break

                  if kind and first_lats:
                      self._add_place(
                          name, kind, sum(first_lats) / len(first_lats), sum(first_lons) / len(first_lons)
                      )

          def build_boundary_index(boundaries):
              # Smallest polygon first so specific towns/local councils match accurately
              sorted_bounds = sorted(boundaries, key=lambda b: b[0])
              grid = defaultdict(list)
              for idx, (_, _, min_lat, max_lat, min_lon, max_lon, _, _) in enumerate(sorted_bounds):
                  x0 = int(math.floor(min_lat * 20))
                  x1 = int(math.floor(max_lat * 20))
                  y0 = int(math.floor(min_lon * 20))
                  y1 = int(math.floor(max_lon * 20))
                  for gx in range(x0, x1 + 1):
                      for gy in range(y0, y1 + 1):
                          grid[(gx, gy)].append(idx)
              return sorted_bounds, grid

          def find_boundary_city(lat, lon, sorted_bounds, boundary_grid):
              gx = int(math.floor(lat * 20))
              gy = int(math.floor(lon * 20))
              for idx in boundary_grid.get((gx, gy), ()):
                  _, name, min_lat, max_lat, min_lon, max_lon, outer_pts, inners = sorted_bounds[idx]
                  if lat < min_lat or lat > max_lat or lon < min_lon or lon > max_lon:
                      continue
                  if point_in_ring(lat, lon, outer_pts):
                      if not any(point_in_ring(lat, lon, inner) for inner in inners):
                          return name
              return ""

          def find_nearest_city_weighted(lat, lon, cities, city_grid):
              gx, gy = int(lat * 10), int(lon * 10)
              best_name = ""
              best_score = 0.2
              weights = {"city": 0.35, "town": 0.65, "village": 1.0}
              for dx in (-2, -1, 0, 1, 2):
                  for dy in (-2, -1, 0, 1, 2):
                      for idx in city_grid.get((gx + dx, gy + dy), ()):
                          cname, kind, clat, clon = cities[idx]
                          dist = math.hypot(lat - clat, lon - clon)
                          if dist > 0.2:
                              continue
                          score = dist * weights.get(kind, 1.0)
                          if score < best_score:
                              best_score = score
                              best_name = cname
              return best_name

          class StreetAndAddressCollector(osmium.SimpleHandler):
              def __init__(self):
                  super().__init__()
                  self.raw_streets = []
                  self.raw_addresses = []
                  self.street_city_votes = defaultdict(list)

              def node(self, n):
                  street = (n.tags.get("addr:street") or "").strip()
                  housenumber = (n.tags.get("addr:housenumber") or "").strip()
                  if street and housenumber:
                      lat, lon = n.location.lat, n.location.lon
                      city = (n.tags.get("addr:city") or "").strip()
                      self.raw_addresses.append((city, street, housenumber, lat, lon))
                      if city:
                          self.street_city_votes[street].append((city, lat, lon))

              def way(self, w):
                  highway = w.tags.get("highway")
                  street_addr = (w.tags.get("addr:street") or "").strip()
                  housenumber = (w.tags.get("addr:housenumber") or "").strip()

                  coords = []
                  for n in w.nodes:
                      try:
                          if n.location.valid():
                              coords.append((n.location.lat, n.location.lon))
                      except osmium.InvalidLocationError:
                          continue

                  if not coords:
                      return

                  mid_lat, mid_lon = coords[len(coords) // 2]

                  if highway and highway in STREET_HIGHWAYS:
                      name = pick_name(w.tags)
                      if name:
                          city = (w.tags.get("addr:city") or "").strip()
                          self.raw_streets.append((city, name, mid_lat, mid_lon))

                  if street_addr and housenumber:
                      avg_lat = sum(c[0] for c in coords) / len(coords)
                      avg_lon = sum(c[1] for c in coords) / len(coords)
                      city = (w.tags.get("addr:city") or "").strip()
                      self.raw_addresses.append((city, street_addr, housenumber, avg_lat, avg_lon))
                      if city:
                          self.street_city_votes[street_addr].append((city, avg_lat, avg_lon))

          print("Pass 1: Collecting places, POIs & municipal boundaries...")
          place_handler = PlaceCollector()
          place_handler.apply_file(osm_path, locations=True)
          sorted_bounds, boundary_grid = build_boundary_index(place_handler.boundaries)
          print(
              f"Found {len(place_handler.places)} places & POIs, "
              f"{len(place_handler.cities)} cities/towns/villages, "
              f"{len(sorted_bounds)} boundary polygons."
          )

          print("Pass 2: Collecting streets and addresses...")
          addr_handler = StreetAndAddressCollector()
          addr_handler.apply_file(osm_path, locations=True)
          print(
              f"Collected {len(addr_handler.raw_streets)} street segments and "
              f"{len(addr_handler.raw_addresses)} raw address entries."
          )

          city_cache = {}
          def resolve_city(lat, lon, street_name, explicit_city):
              if explicit_city:
                  return explicit_city
              ckey = (round(lat, 4), round(lon, 4), street_name)
              cached = city_cache.get(ckey)
              if cached is not None:
                  return cached

              # 1. Municipal boundary polygon (admin_level=8 or place area)
              resolved = find_boundary_city(lat, lon, sorted_bounds, boundary_grid)

              # 2. Vote from addr:city on buildings along the same street within ~1.2 km
              if not resolved and street_name:
                  votes = Counter()
                  for v_city, v_lat, v_lon in addr_handler.street_city_votes.get(street_name, ()):
                      if abs(lat - v_lat) < 0.012 and abs(lon - v_lon) < 0.012:
                          votes[v_city] += 1
                  if votes:
                      resolved = votes.most_common(1)[0][0]

              # 3. Weighted nearest place fallback
              if not resolved:
                  resolved = find_nearest_city_weighted(
                      lat, lon, place_handler.cities, place_handler.city_grid
                  )

              city_cache[ckey] = resolved
              return resolved

          streets_acc = {}
          for explicit_city, name, mid_lat, mid_lon in addr_handler.raw_streets:
              city = resolve_city(mid_lat, mid_lon, name, explicit_city)
              key = (city, name)
              acc = streets_acc.get(key)
              if acc is None:
                  streets_acc[key] = [mid_lat, mid_lon, 1]
              else:
                  acc[0] += mid_lat
                  acc[1] += mid_lon
                  acc[2] += 1

          addresses_map = {}
          # Insert addresses with explicit addr:city first so they take precedence over inferred ones
          for explicit_city, street_addr, housenumber, lat, lon in sorted(
              addr_handler.raw_addresses, key=lambda x: 0 if x[0] else 1
          ):
              city = resolve_city(lat, lon, street_addr, explicit_city)
              akey = (city, street_addr, housenumber)
              if akey not in addresses_map:
                  addresses_map[akey] = (lat, lon)

          print(f"Resolved {len(streets_acc)} unique streets and {len(addresses_map)} unique addresses.")

          street_key_to_id = {}
          street_rows = []
          for idx, ((city, street), acc) in enumerate(sorted(streets_acc.items()), start=1):
              street_key_to_id[(city, street)] = idx
              street_rows.append((idx, city, street, acc[0] / acc[2], acc[1] / acc[2]))

          address_rows = []
          for (city, street, housenumber), (lat, lon) in addresses_map.items():
              s_id = street_key_to_id.get((city, street))
              if s_id is None:
                  s_id = len(street_rows) + 1
                  street_key_to_id[(city, street)] = s_id
                  street_rows.append((s_id, city, street, lat, lon))
              address_rows.append((s_id, housenumber, lat, lon))

          conn = sqlite3.connect(db_path)
          conn.execute("PRAGMA journal_mode = OFF")
          conn.execute("PRAGMA synchronous = OFF")
          conn.execute("PRAGMA page_size = 4096")

          conn.execute("""
              CREATE TABLE places (
                  name TEXT NOT NULL,
                  kind TEXT NOT NULL,
                  lat REAL NOT NULL,
                  lon REAL NOT NULL
              )
          """)

          conn.execute("""
              CREATE TABLE streets (
                  street_id INTEGER PRIMARY KEY,
                  city TEXT NOT NULL,
                  street_name TEXT NOT NULL,
                  lat REAL NOT NULL,
                  lon REAL NOT NULL
              )
          """)

          conn.execute("""
              CREATE TABLE addresses (
                  street_id INTEGER NOT NULL,
                  house_number TEXT NOT NULL,
                  lat REAL NOT NULL,
                  lon REAL NOT NULL
              )
          """)

          conn.executemany(
              "INSERT INTO places (name, kind, lat, lon) VALUES (?, ?, ?, ?)",
              place_handler.places
          )

          conn.executemany(
              "INSERT INTO streets (street_id, city, street_name, lat, lon) VALUES (?, ?, ?, ?, ?)",
              street_rows
          )

          conn.executemany(
              "INSERT INTO addresses (street_id, house_number, lat, lon) VALUES (?, ?, ?, ?)",
              address_rows
          )

          conn.execute("CREATE INDEX idx_places_name ON places(name)")
          conn.execute("CREATE INDEX idx_places_lat_lon ON places(lat, lon)")
          conn.execute("CREATE INDEX idx_streets_name ON streets(street_name, city)")
          conn.execute("CREATE INDEX idx_streets_lat_lon ON streets(lat, lon)")
          conn.execute("CREATE INDEX idx_addresses_lookup ON addresses(street_id, house_number)")
          conn.execute("CREATE INDEX idx_addresses_lat_lon ON addresses(lat, lon)")

          conn.commit()
          conn.execute("ANALYZE")
          conn.execute("VACUUM")
          conn.close()
          print("Compact address database built successfully.")
          EOF

          python build/build_addresses.py build/israel.osm.pbf build/map-pack/israel-addresses.sqlite

      - name: Bundle and verify israel-map-pack.zip
        shell: bash
        run: |
          set -euo pipefail

          PMTILES="build/map-pack/israel-basemap.pmtiles"
          GH_DIR="build/map-pack/graphhopper-foot"
          ADDR_DB="build/map-pack/israel-addresses.sqlite"

          if [ ! -f "$PMTILES" ]; then
            echo "Error: PMTiles file missing."
            exit 1
          fi

          HEADER=$(head -c 7 "$PMTILES")
          if [ "$HEADER" != "PMTiles" ]; then
            echo "Error: Invalid PMTiles header."
            exit 1
          fi

          if [ ! -d "$GH_DIR" ] || [ -z "$(ls -A "$GH_DIR")" ]; then
            echo "Error: GraphHopper foot graph missing."
            exit 1
          fi

          if [ ! -f "$ADDR_DB" ]; then
            echo "Error: Addresses SQLite missing."
            exit 1
          fi

          echo "Individual file sizes before packaging:"
          du -sh "$PMTILES" "$GH_DIR" "$ADDR_DB"
          echo "GraphHopper internal files:"
          ls -lh "$GH_DIR"

          (cd build/map-pack && zip -r ../israel-map-pack.zip .)

          PACK="build/israel-map-pack.zip"
          PACK_SIZE=$(stat -c%s "$PACK")
          echo "Final israel-map-pack.zip size: $PACK_SIZE bytes"
          ls -lh "$PACK"

          if [ "$PACK_SIZE" -lt 10000000 ]; then
            echo "Error: Final map pack is suspiciously small."
            exit 1
          fi

      - name: Publish dedicated offline-map release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="offline-map"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Updating existing $TAG release..."
            gh release upload "$TAG" build/israel-map-pack.zip --clobber
          else
            echo "Creating new dedicated $TAG release..."
            gh release create "$TAG" \
              build/israel-map-pack.zip \
              --title "חבילת מפה וניווט לא מקוונת" \
              --notes "חבילה מאוחדת לישראל הכוללת מפה וקטורית (PMTiles), מנוע הליכה (GraphHopper) ואינדקס רחובות וכתובות."
          fi

          echo "Map pack published under tag: $TAG"

      - name: Clean up temporary files
        if: always()
        shell: bash
        run: rm -rf build
