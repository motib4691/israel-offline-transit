name: Update Israeli Transit Data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 1 * *"

permissions:
  contents: write

concurrency:
  group: transit-data-update
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Build and publish transit database
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download official transport data
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p build/source build/output

          curl -fL --retry 3 --retry-delay 5 \
            "https://gtfs.mot.gov.il/gtfsfiles/israel-public-transportation.zip" \
            -o build/source/israel-public-transportation.zip

      - name: Verify source archive
        shell: bash
        run: |
          set -euo pipefail

          python -m zipfile -t build/source/israel-public-transportation.zip

      - name: Build SQLite database
        shell: bash
        run: |
          set -euo pipefail

          SCRIPT="build_data.py"
          if [ -f "scripts/build_data.py" ]; then
            SCRIPT="scripts/build_data.py"
          fi

          python "$SCRIPT" \
            --gtfs build/source/israel-public-transportation.zip \
            --output build/output/israel-transit.sqlite

      - name: Checkout app repository
        uses: actions/checkout@v4
        with:
          repository: motib4691/israeltransit
          path: app-source

      - name: Prepare routing data
        shell: bash
        run: |
          set -euo pipefail

          python app-source/app/scripts/prepare_routing_data.py \
            --database build/output/israel-transit.sqlite

      - name: Final database vacuum and optimization
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import sqlite3
          from pathlib import Path

          path = Path("build/output/israel-transit.sqlite")
          conn = sqlite3.connect(path)
          print("Packing and vacuuming database...")
          conn.execute("VACUUM")
          conn.close()
          print("VACUUM completed successfully.")
          PY

      - name: Validate calendar and trip services
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import sqlite3
          from datetime import datetime, timedelta
          from pathlib import Path

          path = Path("build/output/israel-transit.sqlite")
          db = sqlite3.connect(path)
          db.row_factory = sqlite3.Row

          def columns(table):
              return {
                  row["name"]
                  for row in db.execute(f'PRAGMA table_info("{table}")')
              }

          def decode_uvarint(buf, pos):
              result = 0
              shift = 0
              while True:
                  b = buf[pos]
                  pos += 1
                  result |= (b & 0x7F) << shift
                  if b < 0x80:
                      return result, pos
                  shift += 7

          required_calendar_columns = {
              "service_idx", "weekday_mask", "start_date", "end_date"
          }
          calendar_columns = columns("calendar")
          missing_columns = required_calendar_columns - calendar_columns
          if missing_columns:
              raise SystemExit(
                  "calendar is missing columns: "
                  + ", ".join(sorted(missing_columns))
              )

          if "trips_blob" not in columns("pattern_schedules"):
              raise SystemExit("pattern_schedules is missing trips_blob")

          calendar_rows = db.execute("""
              SELECT service_idx, weekday_mask, start_date, end_date
              FROM calendar
          """).fetchall()

          added_dates_by_service = {}
          for row in db.execute("""
              SELECT service_idx, date, exception_type
              FROM calendar_dates
          """):
              if int(row["exception_type"]) == 1:
                  added_dates_by_service.setdefault(row["service_idx"], set()).add(
                      int(row["date"])
                  )

          print(f"Calendar services: {len(calendar_rows):,}")

          errors = []
          seen_ids = set()
          inactive_services = []

          for row in calendar_rows:
              service_idx = row["service_idx"]

              if service_idx in seen_ids:
                  errors.append(
                      f"Duplicate calendar service_idx: {service_idx}"
                  )
              seen_ids.add(service_idx)

              try:
                  start = datetime.strptime(
                      str(row["start_date"]), "%Y%m%d"
                  ).date()
                  end = datetime.strptime(
                      str(row["end_date"]), "%Y%m%d"
                  ).date()
              except (ValueError, TypeError):
                  errors.append(
                      f"Invalid date for service_idx {service_idx}: "
                      f"{row['start_date']} - {row['end_date']}"
                  )
                  continue

              if start > end:
                  errors.append(
                      f"start_date is after end_date for service_idx "
                      f"{service_idx}"
                  )
                  continue

              mask = int(row["weekday_mask"])
              if mask < 0 or mask > 127:
                  errors.append(
                      f"Invalid weekday_mask for service_idx "
                      f"{service_idx}: {mask}"
                  )
                  continue

              active_weekday_numbers = {
                  bit for bit in range(7) if (mask & (1 << bit)) != 0
              }
              has_added_date = bool(added_dates_by_service.get(service_idx))

              if not active_weekday_numbers and not has_added_date:
                  inactive_services.append(service_idx)
                  continue

              has_active_date = has_added_date
              if not has_active_date:
                  current = start
                  while current <= end:
                      if current.weekday() in active_weekday_numbers:
                          has_active_date = True
                          break
                      current += timedelta(days=1)

              if not has_active_date:
                  inactive_services.append(service_idx)

          used_services = set()
          for row in db.execute(
              "SELECT trip_count, trips_blob FROM pattern_schedules"
          ):
              t_count = int(row["trip_count"])
              blob = bytes(row["trips_blob"])
              pos = 0
              for _ in range(t_count):
                  _, pos = decode_uvarint(blob, pos)
                  s_idx, pos = decode_uvarint(blob, pos)
                  _, pos = decode_uvarint(blob, pos)
                  _, pos = decode_uvarint(blob, pos)
                  used_services.add(s_idx)

          missing_services = sorted(used_services - seen_ids)

          print("\nSERVICE VALIDATION REPORT")

          if missing_services:
              print(
                  f"ERROR: {len(missing_services):,} service_idx values "
                  "in pattern_schedules are missing from calendar."
              )
              for s_idx in missing_services[:100]:
                  print(f"  Missing service_idx: {s_idx}")
              errors.append(
                  f"{len(missing_services)} trip service IDs have no calendar entry"
              )
          else:
              print("All trip service IDs exist in calendar.")

          if inactive_services:
              print(
                  f"\nWARNING: {len(inactive_services):,} services "
                  "have no active date in their date range."
              )
              for s_idx in inactive_services[:30]:
                  print(f"  Inactive service_idx: {s_idx}")
              if len(inactive_services) > 30:
                  print("  Additional services omitted from this report.")
          else:
              print("All calendar services have at least one active date.")

          if errors:
              print("\nVALIDATION FAILED:")
              for error in errors:
                  print(f"  - {error}")
              db.close()
              raise SystemExit(1)

          print("\nCalendar and trip service validation successful.")
          db.close()
          PY

      - name: Verify database and report table sizes
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import sqlite3
          from pathlib import Path

          path = Path("build/output/israel-transit.sqlite")
          if not path.is_file() or path.stat().st_size == 0:
              raise SystemExit("Database file is missing or empty")

          db = sqlite3.connect(path)

          integrity = db.execute("PRAGMA integrity_check").fetchone()[0]
          if integrity != "ok":
              raise SystemExit(f"Integrity check failed: {integrity}")

          required = {
              "agency", "routes", "stops", "calendar", "calendar_dates",
              "headsigns", "import_metadata", "route_patterns",
              "route_pattern_stops", "timing_profiles", "pattern_schedules"
          }

          tables = {
              row[0] for row in db.execute(
                  "SELECT name FROM sqlite_master WHERE type='table'"
              )
          }

          missing = required - tables
          if missing:
              raise SystemExit("Missing tables: " + ", ".join(sorted(missing)))

          print("\nDATABASE TABLE COUNTS")
          for table in sorted(tables):
              if table.startswith("sqlite_"):
                  continue
              count = db.execute(
                  'SELECT COUNT(*) FROM "' + table.replace('"', '""') + '"'
              ).fetchone()[0]
              print(f"{table}: {count:,} rows")

          total_trips = db.execute(
              "SELECT COALESCE(SUM(trip_count), 0) FROM pattern_schedules"
          ).fetchone()[0]
          print(f"encoded_trips_total: {total_trips:,}")

          print("\nOPTIMIZED DATABASE SIZE")
          print(f"{path.stat().st_size:,} bytes")
          db.close()
          PY

      - name: Compress database (level 9)
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import gzip
          import shutil
          from pathlib import Path

          source = Path("build/output/israel-transit.sqlite")
          target = Path("build/output/israel-transit.sqlite.gz")

          with source.open("rb") as input_file:
              with target.open("wb") as raw_output:
                  with gzip.GzipFile(
                      filename="israel-transit.sqlite",
                      mode="wb",
                      fileobj=raw_output,
                      compresslevel=9,
                      mtime=0
                  ) as compressed:
                      shutil.copyfileobj(input_file, compressed)

          print(f"Original size:   {source.stat().st_size:,} bytes")
          print(f"Compressed size: {target.stat().st_size:,} bytes")
          PY

      - name: Verify compressed database
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import gzip
          import sqlite3
          from pathlib import Path

          compressed = Path("build/output/israel-transit.sqlite.gz")
          temporary = Path("build/output/verify.sqlite")

          with gzip.open(compressed, "rb") as source:
              with temporary.open("wb") as target:
                  while True:
                      chunk = source.read(8 * 1024 * 1024)
                      if not chunk:
                          break
                      target.write(chunk)

          db = sqlite3.connect(temporary)
          result = db.execute("PRAGMA integrity_check").fetchone()[0]
          db.close()

          if result != "ok":
              raise SystemExit(
                  f"Compressed database verification failed: {result}"
              )

          temporary.unlink()
          print("Compressed database verified successfully.")
          print(f"Final release file size: {compressed.stat().st_size:,} bytes")
          PY

      - name: Publish dedicated transit-data release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="transit-data"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Updating existing $TAG release..."
            gh release upload "$TAG" build/output/israel-transit.sqlite.gz --clobber
          else
            echo "Creating new dedicated $TAG release..."
            gh release create "$TAG" \
              build/output/israel-transit.sqlite.gz \
              --title "מאגר נתוני תחבורה (GTFS)" \
              --notes "מאגר נתוני תחבורה ציבורית מעודכן בפורמט SQLite דחוס."
          fi

          echo "Transit data published under tag: $TAG"

      - name: Remove temporary files
        if: always()
        shell: bash
        run: rm -rf build
